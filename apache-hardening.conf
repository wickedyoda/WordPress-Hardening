# ---------------------------------------------------------------------------
# wickedyoda/wordpress-hardened  --  Apache hardening drop-in
#
# Installed to /etc/apache2/conf-enabled/zz-hardening.conf
#
# /etc/apache2/apache2.conf line 222 contains:
#     IncludeOptional conf-enabled/*.conf
# which is AFTER the stock <Directory /var/www/> block at ~line 170. Directives
# here therefore WIN over the image defaults. The ".conf" suffix is required.
#
# Every block below is enforced at SERVER config level, not in .htaccess, so
# the protection holds even if .htaccess is deleted or AllowOverride is reset.
# ---------------------------------------------------------------------------

# The stock image ships "AllowOverride None", which silently disables EVERY
# .htaccess directive while the site still appears to work -- WordPress rewrite
# rules resolve through the vhost, so nothing looks broken. Enable it so the
# blocks in /var/www/html/.htaccess actually take effect.
#
# Options -Indexes removes auto-generated directory listings, which otherwise
# expose the file tree of any directory lacking an index file.
<Directory /var/www/>
    AllowOverride All
    Options -Indexes
</Directory>

# Hide the PHP version. Without this, every response advertises
# "X-Powered-By: PHP/8.3.36", which tells an attacker exactly which PHP
# vulnerabilities to try next. php_admin_flag cannot be overridden by
# .htaccess, unlike php_flag.
<Directory /var/www/html>
    php_admin_flag expose_php off
    php_admin_flag display_errors off
</Directory>

# Do not advertise the Apache version, modules or OS in headers and error
# pages (default sends "Server: Apache/2.4.69 (Debian)").
ServerTokens Prod
ServerSignature Off

# Information-disclosure files. Blocked here rather than in .htaccess so the
# block survives losing .htaccess. readme.html and license.txt leak the exact
# WordPress version; wp-config backups and .env/.gitignore leak credentials.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.(php|html)|wp-config\.php\.(bak|old|orig|save|swp|txt)|\..*)$">
    Require all denied
</FilesMatch>

# Never execute PHP inside the uploads tree. This closes the classic webshell
# path: upload an image whose name ends in .php, then request it directly.
<Directory /var/www/html/wp-content/uploads>
    Options -Indexes
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar|pht)$">
        Require all denied
    </FilesMatch>
</Directory>

# Log, backup and configuration files must never be reachable over HTTP.
#
# This is not theoretical. The site this image was written for served
# /wp-content/php-error.log openly - 501 KB / 4,387 lines containing 206 PHP
# warnings, 235 fatal errors, 34 absolute filesystem paths and 679 stack
# traces - because PHP had been configured to write its error log inside the
# document root. Closing it here, rather than moving the file, means existing
# tooling that tails the log keeps working.
#
# .json and .svg are deliberately NOT blocked: WordPress and its plugins serve
# those legitimately.
<FilesMatch "\.(?i:log|sql|sqlite|sqlite3|bak|backup|old|orig|save|swp|swo|tmp|temp|tar|tgz|gz|zip|bz2|7z|rar|conf|ini|yml|yaml|sh|lock|dist)$">
    Require all denied
</FilesMatch>

# ---------------------------------------------------------------------------
# OPTIONAL - uncomment to disable XML-RPC entirely.
#
# xmlrpc.php is a legacy remote-publishing endpoint and a favourite target for
# brute-force amplification (system.multicall lets one request try hundreds of
# passwords). This site is a brochure/gallery with no remote publishing, so
# there is nothing to lose - but it CAN break Jetpack, the WordPress mobile
# app, and some desktop publishing tools. Enable only if you are not using any
# of those.
#
# <Files "xmlrpc.php">
#     Require all denied
# </Files>
# ---------------------------------------------------------------------------
