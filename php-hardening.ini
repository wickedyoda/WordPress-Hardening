; ---------------------------------------------------------------------------
; wickedyoda/wordpress-hardened  --  PHP hardening
;
; Installed to /usr/local/etc/php/conf.d/zz-hardening.ini
;
; conf.d is loaded in alphabetical order. "zz-hardening.ini" sorts AFTER the
; commonly mounted "zz-custom.ini", so values here win where keys collide.
; Only security-relevant keys are set, so php-custom.ini keeps ownership of
; upload limits, memory_limit, max_execution_time and error_log placement.
; ---------------------------------------------------------------------------

; Never advertise the PHP version in responses (X-Powered-By: PHP/8.3.36).
expose_php = Off

; Never render errors to visitors. A PHP stack trace leaks absolute paths,
; database details and plugin internals - a recognised information-disclosure
; issue. Errors are still logged, just not displayed.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Block the remote-file-include wrapper, which is how an LFI becomes RCE
; (allow_url_include lets include() fetch and execute a remote URL).
; note: allow_url_fopen must stay On - WordPress core needs it for updates,
; cron and some media fetches.
allow_url_include = Off

; --- Session cookie hardening (defence in depth) ---------------------------
; WordPress core does not use PHP sessions, but plugins do. These prevent a
; session ID from being read by JavaScript, from travelling in the URL, and
; from being adopted before the server has seen it.
session.cookie_httponly = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
