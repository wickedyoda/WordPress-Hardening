name: Build hardened WordPress image

# Three ways this runs:
#   push      -> rebuild whenever the hardening files change
#   schedule  -> WEEKLY rebuild straight from upstream, so WordPress and PHP
#                security updates flow in without anyone touching this repo.
#                THIS is what "staying in line with the official image" means
#                in practice - no rebasing, no generated Dockerfiles.
#   manual    -> Actions > Run workflow, optionally with a different base.
#
# All actions are pinned to a full commit SHA. A mutable tag such as @v7 can be
# repointed at new code by whoever controls the action, which is a supply-chain
# risk this repo should not carry. The trailing comment records which release
# each SHA is, so bumps stay reviewable.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"        # Sundays 04:17 UTC
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image to build FROM (e.g. wordpress:8.3-apache)"
        required: false
        default: "wordpress:8.3-apache"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wordpress-hardened

jobs:
  build:
    # Pinned rather than ubuntu-latest: that label migrates to Ubuntu 26 in
    # October 2026, and an image build should not change under you.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write          # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || 'wordpress:8.3-apache' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-apache
          # OCI attestations: records what was built and from what.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only vulnerability scan. continue-on-error plus exit-code 0 means
      # an unfixable upstream CVE -- or a broken scanner -- never blocks a
      # deployment you actually need. Read the log; do not gate on it.
      - name: Scan for vulnerabilities (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-apache
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
