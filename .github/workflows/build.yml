name: Build hardened WordPress image

# Three ways this runs:
#   push      -> rebuild whenever the hardening files change
#   schedule  -> WEEKLY rebuild straight from upstream, so WordPress and PHP
#                security updates flow in without anyone touching this repo.
#                THIS is what "staying in line with the official image" means
#                in practice - no rebasing, no generated Dockerfiles.
#   manual    -> Actions > Run workflow, optionally with a different base.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 0"        # Sundays 04:17 UTC
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image to build FROM (e.g. wordpress:8.3-apache)"
        required: false
        default: "wordpress:8.3-apache"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wordpress-hardened

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || 'wordpress:8.3-apache' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-apache
          # OCI attestations: records what was built and from what.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Report-only vulnerability scan. exit-code 0 so an unfixable upstream
      # CVE never blocks a deployment you actually need. Read the log.
      - name: Scan for vulnerabilities (report only)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-apache
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
